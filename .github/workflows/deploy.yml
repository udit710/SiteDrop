name: Deploy Static Site with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreate instance (destroys existing)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  INSTANCE_TYPE: t3.micro
  INSTANCE_NAME: static-site-docker-host
  DEPLOYMENT_DIR: /opt/static-site

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Check for existing instance
      id: existing
      run: |
        # Look for existing Docker-enabled instance
        INSTANCE_DATA=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
                   "Name=instance-state-name,Values=running,pending,stopping,stopped" \
          --query 'Reservations[0].Instances[0].[InstanceId,State.Name,PublicIpAddress]' \
          --output text 2>/dev/null || echo "None None None")

        INSTANCE_ID=$(echo $INSTANCE_DATA | cut -f1)
        INSTANCE_STATE=$(echo $INSTANCE_DATA | cut -f2)
        PUBLIC_IP=$(echo $INSTANCE_DATA | cut -f3)

        if [ "$INSTANCE_ID" != "None" ] && [ "$INSTANCE_ID" != "" ]; then
          echo "Found existing instance: $INSTANCE_ID (state: $INSTANCE_STATE)"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_state=$INSTANCE_STATE" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "No existing instance found"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Handle force recreate
      if: github.event.inputs.force_recreate == 'true' && steps.existing.outputs.exists == 'true'
      run: |
        echo "Force recreate requested - terminating existing instance"
        aws ec2 terminate-instances --instance-ids ${{ steps.existing.outputs.instance_id }}
        aws ec2 wait instance-terminated --instance-ids ${{ steps.existing.outputs.instance_id }}
        echo "exists=false" >> $GITHUB_OUTPUT
      id: force_recreate

    - name: Start stopped instance
      if: steps.existing.outputs.exists == 'true' && steps.existing.outputs.instance_state == 'stopped' && github.event.inputs.force_recreate != 'true'
      id: start_stopped
      run: |
        echo "Starting stopped instance..."
        aws ec2 start-instances --instance-ids ${{ steps.existing.outputs.instance_id }}
        aws ec2 wait instance-running --instance-ids ${{ steps.existing.outputs.instance_id }}

        # Get new public IP
        PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids ${{ steps.existing.outputs.instance_id }} \
          --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

    - name: Setup infrastructure for new instance
      if: steps.existing.outputs.exists == 'false' || steps.force_recreate.outputs.exists == 'false'
      id: infrastructure
      run: |
        # Check for existing security group
        SG_ID=$(aws ec2 describe-security-groups \
          --filters "Name=group-name,Values=static-site-docker-sg" \
          --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "None")

        if [ "$SG_ID" = "None" ] || [ "$SG_ID" = "" ]; then
          echo "Creating security group..."
          SG_ID=$(aws ec2 create-security-group \
            --group-name "static-site-docker-sg" \
            --description "Security group for Docker-based static site hosting" \
            --query 'GroupId' --output text)

          # Allow HTTP traffic
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0

          # Allow SSH (temporary for deployment)
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0
        fi

        echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT

        # Check for existing key pair
        if ! aws ec2 describe-key-pairs --key-names "static-site-docker-key" >/dev/null 2>&1; then
          echo "Creating key pair..."
          aws ec2 create-key-pair --key-name "static-site-docker-key" --query 'KeyMaterial' --output text > key.pem
          chmod 600 key.pem
          echo "key_created=true" >> $GITHUB_OUTPUT
        else
          echo "Using existing key pair"
          echo "key_created=false" >> $GITHUB_OUTPUT
        fi

    - name: Create new Docker-enabled instance
      if: steps.existing.outputs.exists == 'false' || steps.force_recreate.outputs.exists == 'false'
      id: new_instance
      run: |
        # Get latest Amazon Linux 2 AMI
        AMI_ID=$(aws ec2 describe-images \
          --owners amazon \
          --filters "Name=name,Values=amzn2-ami-hvm-*-x86_64-gp2" \
          --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
          --output text)

        # Create user data script for Docker setup
        cat > user-data.sh << 'EOF'
        #!/bin/bash
        set -e

        # Log everything
        exec > >(tee /var/log/user-data.log) 2>&1

        echo "Starting Docker setup..."

        # Update system
        yum update -y

        # Install Docker
        yum install -y docker git

        # Start Docker service
        systemctl start docker
        systemctl enable docker

        # Add ec2-user to docker group
        usermod -a -G docker ec2-user

        # Install Docker Compose
        curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose

        # Install nginx for reverse proxy
        amazon-linux-extras install -y nginx1

        # Create deployment directory
        mkdir -p /opt/static-site
        chown ec2-user:ec2-user /opt/static-site

        # Configure nginx as reverse proxy
        cat > /etc/nginx/conf.d/docker-proxy.conf << 'NGINX_EOF'
        upstream docker_backend {
            server 127.0.0.1:8080;
        }

        server {
            listen 80;
            server_name _;

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "nginx healthy\n";
                add_header Content-Type text/plain;
            }

            # Proxy to Docker container
            location / {
                proxy_pass http://docker_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
        }
        NGINX_EOF

        # Remove default nginx config
        rm -f /etc/nginx/conf.d/default.conf

        # Start nginx
        systemctl start nginx
        systemctl enable nginx

        echo "Docker setup completed!"
        EOF

        # Launch instance
        INSTANCE_ID=$(aws ec2 run-instances \
          --image-id "$AMI_ID" \
          --count 1 \
          --instance-type ${{ env.INSTANCE_TYPE }} \
          --key-name "static-site-docker-key" \
          --security-group-ids ${{ steps.infrastructure.outputs.sg_id }} \
          --user-data file://user-data.sh \
          --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.INSTANCE_NAME }}},{Key=Project,Value=github-actions-docker-deploy},{Key=ManagedBy,Value=github-actions},{Key=Type,Value=docker-enabled}]" \
          --query 'Instances[0].InstanceId' --output text)

        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

        # Wait for instance to be running
        echo "Waiting for instance to be running..."
        aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

        # Get public IP
        PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids "$INSTANCE_ID" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)

        echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
        echo "Instance created: $INSTANCE_ID"
        echo "Public IP: $PUBLIC_IP"

    - name: Prepare deployment files
      run: |
        echo "Creating deployment archive..."
        # Create tar with all source files
        tar -czf deployment.tar.gz \
          --exclude='.git*' \
          --exclude='node_modules' \
          --exclude='*.tar.gz' \
          --exclude='key.pem' \
          --exclude='user-data.sh' \
          .

    - name: Get instance details
      id: instance_info
      run: |
        # Use existing instance ID or new instance ID
        if [ "${{ steps.existing.outputs.exists }}" = "true" ] && [ "${{ github.event.inputs.force_recreate }}" != "true" ]; then
          INSTANCE_ID="${{ steps.existing.outputs.instance_id }}"
          if [ "${{ steps.existing.outputs.instance_state }}" = "stopped" ]; then
            PUBLIC_IP="${{ steps.start_stopped.outputs.public_ip }}"
          else
            PUBLIC_IP="${{ steps.existing.outputs.public_ip }}"
          fi
        else
          INSTANCE_ID="${{ steps.new_instance.outputs.instance_id }}"
          PUBLIC_IP="${{ steps.new_instance.outputs.public_ip }}"
        fi

        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

    - name: Wait for Docker setup on new instance
      if: steps.existing.outputs.exists == 'false' || steps.force_recreate.outputs.exists == 'false'
      run: |
        PUBLIC_IP=${{ steps.instance_info.outputs.public_ip }}

        echo "Waiting for Docker setup to complete on new instance..."
        for i in {1..60}; do
          if ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ec2-user@$PUBLIC_IP "docker --version && docker-compose --version" 2>/dev/null; then
            echo "✅ Docker setup completed!"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "❌ Timeout waiting for Docker setup"
            exit 1
          fi
          echo "⏳ Attempt $i/60: Waiting for Docker setup..."
          sleep 30
        done

    - name: Deploy to Docker container
      run: |
        PUBLIC_IP=${{ steps.instance_info.outputs.public_ip }}

        # Wait for SSH to be available
        echo "Ensuring SSH connectivity..."
        for i in {1..20}; do
          if ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ec2-user@$PUBLIC_IP "echo 'SSH ready'" 2>/dev/null; then
            echo "SSH is ready!"
            break
          fi
          echo "Attempt $i/20: SSH not ready, waiting 10 seconds..."
          sleep 10
        done

        # Copy deployment files
        echo "Uploading deployment files..."
        scp -i key.pem -o StrictHostKeyChecking=no deployment.tar.gz ec2-user@$PUBLIC_IP:${{ env.DEPLOYMENT_DIR }}/

        # Extract and deploy
        echo "Extracting and deploying..."
        ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@$PUBLIC_IP << 'DEPLOY_EOF'
        set -e
        cd ${{ env.DEPLOYMENT_DIR }}

        # Extract new files
        tar -xzf deployment.tar.gz

        # Build and deploy with zero-downtime
        echo "Building Docker image..."
        docker build -t static-site:latest .

        # Check if container exists and is running
        if docker ps -q -f name=static-site-web | grep -q .; then
          echo "Performing rolling update..."

          # Stop and backup current container
          docker stop static-site-web || true
          docker rename static-site-web static-site-web-backup 2>/dev/null || true

          # Start new container
          docker run -d \
            --name static-site-web \
            --restart unless-stopped \
            -p 8080:80 \
            static-site:latest

          # Health check
          echo "Performing health check..."
          for i in {1..30}; do
            if curl -f -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Health check failed. Rolling back..."
              docker stop static-site-web || true
              docker rm static-site-web || true
              docker rename static-site-web-backup static-site-web 2>/dev/null || true
              docker start static-site-web || true
              exit 1
            fi
            sleep 2
          done

          # Cleanup backup
          docker rm static-site-web-backup 2>/dev/null || true
        else
          echo "Starting fresh container..."
          docker run -d \
            --name static-site-web \
            --restart unless-stopped \
            -p 8080:80 \
            static-site:latest

          # Health check
          for i in {1..30}; do
            if curl -f -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Health check failed."
              exit 1
            fi
            sleep 2
          done
        fi

        # Cleanup old images (keep last 3)
        docker images static-site --format "table {{.ID}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true

        echo "🎉 Docker deployment completed successfully!"
        DEPLOY_EOF

    - name: Test deployment
      run: |
        PUBLIC_IP=${{ steps.instance_info.outputs.public_ip }}

        # Wait for nginx to be ready
        sleep 10

        # Test the site through nginx proxy
        echo "Testing site availability..."
        for i in {1..15}; do
          if curl -f -s "http://$PUBLIC_IP" > /dev/null; then
            echo "✅ Site is live and accessible!"
            break
          fi
          echo "Attempt $i/15: Site not ready, waiting 5 seconds..."
          sleep 5
        done

        # Get response headers for verification
        echo "Site response headers:"
        curl -I "http://$PUBLIC_IP" || true

        # Test health endpoint
        echo "Testing health endpoint:"
        curl "http://$PUBLIC_IP/health" || true

    - name: Output deployment info
      run: |
        INSTANCE_ID=${{ steps.instance_info.outputs.instance_id }}
        PUBLIC_IP=${{ steps.instance_info.outputs.public_ip }}

        if [ "${{ steps.existing.outputs.exists }}" = "true" ] && [ "${{ github.event.inputs.force_recreate }}" != "true" ]; then
          echo "🔄 Docker Container Update Summary"
          echo "=================================="
          echo "Updated container on existing instance: $INSTANCE_ID"
        else
          echo "🚀 New Docker Deployment Summary"
          echo "==============================="
          echo "Created new Docker-enabled instance: $INSTANCE_ID"
        fi

        echo "Public IP: $PUBLIC_IP"
        echo "Site URL: http://$PUBLIC_IP"
        echo "Health Check: http://$PUBLIC_IP/health"
        echo ""
        echo "🐳 Your static site is now running in Docker! 🎉"
        echo ""
        echo "💡 Benefits of Docker deployment:"
        echo "- Zero-downtime updates (rolling deployments)"
        echo "- Consistent environment across dev/staging/prod"
        echo "- Easy rollbacks and container management"
        echo "- Better resource utilization"
        echo "- Simplified scaling and monitoring"

    - name: Cleanup temporary files
      if: always()
      run: |
        rm -f key.pem user-data.sh deployment.tar.gz || true