name: Deploy SiteDrop

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check if this is first deployment
        id: check-state
        run: |
          cd infra
          # Try to check if state bucket exists
          if aws s3 ls "s3://terraform-state-sitedrop-*" 2>/dev/null; then
            echo "first_deploy=false" >> $GITHUB_OUTPUT
            # Get the actual bucket name
            BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-sitedrop')].Name" --output text)
            echo "state_bucket=$BUCKET" >> $GITHUB_OUTPUT
          else
            echo "first_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: First time setup (create state backend)
        if: steps.check-state.outputs.first_deploy == 'true'
        run: |
          cd infra
          # Initialize without backend first
          terraform init

          # Create state management resources
          terraform apply -target=aws_s3_bucket.terraform_state -target=aws_dynamodb_table.terraform_state_lock -target=random_id.bucket_suffix -auto-approve

          # Get the created bucket name
          STATE_BUCKET=$(terraform output -raw terraform_state_bucket)
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

          # Create backend configuration
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "$STATE_BUCKET"
              key            = "infrastructure/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "terraform-state-lock-sitedrop"
              encrypt        = true
            }
          }
          EOF

          # Migrate state to remote backend
          terraform init -migrate-state -force-copy

      - name: Terraform Init (existing deployment)
        if: steps.check-state.outputs.first_deploy == 'false'
        run: |
          cd infra
          # Create backend configuration with existing bucket
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "${{ steps.check-state.outputs.state_bucket }}"
              key            = "infrastructure/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "terraform-state-lock-sitedrop"
              encrypt        = true
            }
          }
          EOF

          terraform init

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(cd infra && terraform output -raw s3_bucket)
          aws s3 sync ./site s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(cd infra && terraform output -raw cloudfront_id)
          echo "Invalidating CloudFront distribution: $DIST_ID"

          aws cloudfront wait distribution-deployed --id $DIST_ID
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

      - name: Show live URL
        run: |
          URL=$(cd infra && terraform output -raw cloudfront_url)
          echo "Live site URL: https://$URL"