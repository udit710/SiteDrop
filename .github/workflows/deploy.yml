# Deploy/Update Website Infra to AWS using Terraform
name: Deploy Website

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform variables
        id: tfvars
        run: |
          cd infra
          # Extract project name and region from tfvars
          PROJECT_NAME=$(grep 'project_name' user.tfvars | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' user.tfvars | cut -d'"' -f2)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT

      - name: Check if state bucket exists
        id: check-state
        run: |
          cd infra
          PROJECT_NAME="${{ steps.tfvars.outputs.project_name }}"
          # Check if any terraform state bucket exists for this project
          if aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-$PROJECT_NAME')].Name" --output text | grep -q terraform-state-$PROJECT_NAME; then
            echo "state_exists=true" >> $GITHUB_OUTPUT
            # Get the actual bucket name
            BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-$PROJECT_NAME')].Name" --output text | head -n1)
            echo "state_bucket=$BUCKET" >> $GITHUB_OUTPUT
          else
            echo "state_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap - Create state infrastructure
        if: steps.check-state.outputs.state_exists == 'false'
        run: |
          cd infra
          PROJECT_NAME="${{ steps.tfvars.outputs.project_name }}"
          AWS_REGION="${{ steps.tfvars.outputs.aws_region }}"

          # First run without backend to create state bucket
          terraform init -var-file=user.tfvars

          # Create only the state management resources
          terraform apply -var-file=user.tfvars \
                          -target=aws_s3_bucket.terraform_state \
                          -target=aws_s3_bucket_versioning.terraform_state \
                          -target=aws_s3_bucket_server_side_encryption_configuration.terraform_state \
                          -target=aws_s3_bucket_public_access_block.terraform_state \
                          -target=aws_dynamodb_table.terraform_state_lock \
                          -target=random_id.bucket_suffix \
                          -auto-approve

          # Get the actual bucket name that was created
          ACTUAL_BUCKET=$(terraform output -raw terraform_state_bucket)
          echo "Created state bucket: $ACTUAL_BUCKET"

          # Now create the backend configuration
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "$ACTUAL_BUCKET"
              key            = "infrastructure/terraform.tfstate"
              region         = "$AWS_REGION"
              dynamodb_table = "terraform-state-lock-$PROJECT_NAME"
              encrypt        = true
            }
          }
          EOF

          # Migrate local state to remote backend
          terraform init -var-file=user.tfvars -migrate-state -force-copy

      - name: Initialize with existing backend
        if: steps.check-state.outputs.state_exists == 'true'
        run: |
          cd infra
          PROJECT_NAME="${{ steps.tfvars.outputs.project_name }}"
          AWS_REGION="${{ steps.tfvars.outputs.aws_region }}"

          # Create backend configuration with existing bucket
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "${{ steps.check-state.outputs.state_bucket }}"
              key            = "infrastructure/terraform.tfstate"
              region         = "$AWS_REGION"
              dynamodb_table = "terraform-state-lock-$PROJECT_NAME"
              encrypt        = true
            }
          }
          EOF

          terraform init -var-file=user.tfvars

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan -var-file=user.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra
          terraform apply -var-file=user.tfvars -auto-approve

      - name: Upload static site files
        if: github.ref == 'refs/heads/main'
        run: |
          BUCKET=$(cd infra && terraform output -raw s3_bucket)
          aws s3 sync ./site s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/main'
        run: |
          DIST_ID=$(cd infra && terraform output -raw cloudfront_id)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

      - name: Show live URL
        if: github.ref == 'refs/heads/main'
        run: |
          URL=$(cd infra && terraform output -raw cloudfront_url)
          echo "🚀 Live site URL: https://$URL"

      - name: Update repo website
        if: github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          REPO_NAME=${{ github.event.repository.name }}
          URL=$(cd infra && terraform output -raw cloudfront_url)

          # Set description to just the live URL
          NEW_DESC="🚀 Live at: https://$URL"

          echo "Updating description to: $NEW_DESC"
          curl -s -X PATCH \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_OWNER/$REPO_NAME \
            -d "{\"description\": \"$NEW_DESC\"}" > /dev/null

          if [ $? -eq 0 ]; then
            echo "✅ Repository description updated successfully"
          else
            echo "❌ Failed to update repository description"
          fi