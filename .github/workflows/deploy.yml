name: Deploy SiteDrop

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd infra
          terraform init

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve

      - name: Upload static site files
        run: |
          BUCKET=$(cd infra && terraform output -raw s3_bucket)
          aws s3 sync ./site s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(cd infra && terraform output -raw cloudfront_id)
          echo "Invalidating CloudFront distribution: $DIST_ID"

          aws cloudfront wait distribution-deployed --id $DIST_ID
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

      - name: Show live URL
        run: |
          URL=$(cd infra && terraform output -raw cloudfront_url)
          echo "Live site URL: $URL"
