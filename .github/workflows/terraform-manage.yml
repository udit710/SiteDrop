name: Manage Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - 'status'
          - 'restart-container'
          - 'stop-container'
          - 'start-container'
          - 'container-logs'
          - 'stop-instance'
          - 'start-instance'
          - 'restart-instance'
          - 'destroy-infrastructure'
        default: 'status'

env:
  AWS_REGION: us-east-1
  TF_VAR_project_name: ${{ github.event.repository.name }}-docker

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~1.0"
        terraform_wrapper: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Get infrastructure info
      id: terraform_info
      working-directory: terraform
      run: |
        terraform init

        # Check if infrastructure exists
        if terraform show -json > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT

          # Try to get outputs
          PUBLIC_IP=$(terraform output -raw public_ip 2>/dev/null || echo "")
          INSTANCE_ID=$(terraform output -raw instance_id 2>/dev/null || echo "")

          if [ -n "$PUBLIC_IP" ] && [ -n "$INSTANCE_ID" ]; then
            echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
            echo "website_url=http://$PUBLIC_IP" >> $GITHUB_OUTPUT

            # Get instance state from AWS
            INSTANCE_STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "unknown")
            echo "instance_state=$INSTANCE_STATE" >> $GITHUB_OUTPUT
          else
            echo "public_ip=" >> $GITHUB_OUTPUT
            echo "instance_id=" >> $GITHUB_OUTPUT
            echo "instance_state=unknown" >> $GITHUB_OUTPUT
          fi
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Show infrastructure status
      if: steps.terraform_info.outputs.exists == 'true'
      run: |
        echo "🏗️ Infrastructure Status"
        echo "========================"
        echo "Instance ID: ${{ steps.terraform_info.outputs.instance_id }}"
        echo "Public IP: ${{ steps.terraform_info.outputs.public_ip }}"
        echo "Instance State: ${{ steps.terraform_info.outputs.instance_state }}"
        echo "Website URL: ${{ steps.terraform_info.outputs.website_url }}"

        if [ "${{ steps.terraform_info.outputs.instance_state }}" = "running" ]; then
          echo ""
          echo "🔍 Testing connectivity..."

          # Test website
          if curl -f -s "${{ steps.terraform_info.outputs.website_url }}" > /dev/null; then
            echo "✅ Website is accessible"
          else
            echo "❌ Website is not accessible"
          fi

          # Test health endpoint
          if curl -f -s "${{ steps.terraform_info.outputs.website_url }}/health" > /dev/null; then
            echo "✅ Health endpoint is responding"
          else
            echo "❌ Health endpoint is not responding"
          fi
        fi

    - name: No infrastructure found
      if: steps.terraform_info.outputs.exists == 'false'
      run: |
        echo "❌ No Terraform infrastructure found"
        echo "Run the 'Deploy with Terraform and Docker' workflow to create infrastructure."
        exit 1

    - name: Instance management - Stop
      if: github.event.inputs.action == 'stop-instance' && steps.terraform_info.outputs.exists == 'true'
      run: |
        if [ "${{ steps.terraform_info.outputs.instance_state }}" = "running" ]; then
          echo "🛑 Stopping instance..."
          aws ec2 stop-instances --instance-ids ${{ steps.terraform_info.outputs.instance_id }}
          echo "✅ Stop command sent. Instance will stop shortly."
          echo "💡 This saves costs while preserving all data and containers."
        else
          echo "Instance is not running (current state: ${{ steps.terraform_info.outputs.instance_state }})"
        fi

    - name: Instance management - Start
      if: github.event.inputs.action == 'start-instance' && steps.terraform_info.outputs.exists == 'true'
      run: |
        if [ "${{ steps.terraform_info.outputs.instance_state }}" = "stopped" ]; then
          echo "▶️ Starting instance..."
          aws ec2 start-instances --instance-ids ${{ steps.terraform_info.outputs.instance_id }}

          echo "⏳ Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids ${{ steps.terraform_info.outputs.instance_id }}

          echo "✅ Instance started successfully!"
          echo "🌐 Website URL: ${{ steps.terraform_info.outputs.website_url }}"
          echo "💡 Docker containers should automatically restart."
        else
          echo "Instance is not stopped (current state: ${{ steps.terraform_info.outputs.instance_state }})"
        fi

    - name: Instance management - Restart
      if: github.event.inputs.action == 'restart-instance' && steps.terraform_info.outputs.exists == 'true'
      run: |
        if [ "${{ steps.terraform_info.outputs.instance_state }}" = "running" ]; then
          echo "🔄 Restarting instance..."
          aws ec2 reboot-instances --instance-ids ${{ steps.terraform_info.outputs.instance_id }}
          echo "✅ Restart command sent. Instance will reboot shortly."
          echo "💡 IP address will remain the same (Elastic IP)."
          echo "💡 Docker containers will automatically restart."
        else
          echo "Instance is not running (current state: ${{ steps.terraform_info.outputs.instance_state }})"
        fi

    - name: Container operations info
      if: (github.event.inputs.action == 'restart-container' || github.event.inputs.action == 'stop-container' || github.event.inputs.action == 'start-container' || github.event.inputs.action == 'container-logs') && steps.terraform_info.outputs.exists == 'true'
      run: |
        if [ "${{ steps.terraform_info.outputs.instance_state }}" != "running" ]; then
          echo "❌ Instance is not running. Cannot perform container operations."
          echo "Instance state: ${{ steps.terraform_info.outputs.instance_state }}"
          echo "Start the instance first using the 'start-instance' action."
          exit 1
        fi

        echo "🐳 Container Operations"
        echo "======================"
        echo "Instance IP: ${{ steps.terraform_info.outputs.public_ip }}"
        echo ""
        echo "ℹ️ Container operations require SSH access to the instance."
        echo "Since GitHub Actions doesn't have persistent SSH keys, these operations"
        echo "are informational. To perform actual container operations:"
        echo ""
        echo "1. SSH to your instance:"
        echo "   ssh -i your-key.pem ec2-user@${{ steps.terraform_info.outputs.public_ip }}"
        echo ""
        echo "2. Use the management script:"
        echo "   cd /opt/static-site"
        echo "   ./manage.sh status      # Check container status"
        echo "   ./manage.sh restart     # Restart container"
        echo "   ./manage.sh stop        # Stop container"
        echo "   ./manage.sh start       # Start container"
        echo "   ./manage.sh logs        # View container logs"
        echo ""
        echo "3. Or use Docker commands directly:"
        echo "   docker ps                          # List containers"
        echo "   docker restart static-site-web     # Restart web container"
        echo "   docker logs static-site-web        # View logs"

    - name: Destroy infrastructure
      if: github.event.inputs.action == 'destroy-infrastructure' && steps.terraform_info.outputs.exists == 'true'
      working-directory: terraform
      run: |
        echo "⚠️ DESTROYING ALL INFRASTRUCTURE - THIS CANNOT BE UNDONE!"
        echo "This will permanently delete:"
        echo "- EC2 instance (${{ steps.terraform_info.outputs.instance_id }})"
        echo "- Elastic IP"
        echo "- Security group"
        echo "- Key pair"
        echo "- All data and containers"
        echo ""

        terraform destroy -auto-approve

        echo "✅ Infrastructure destroyed successfully."
        echo "💡 To redeploy, run the 'Deploy with Terraform and Docker' workflow."

    - name: Cost information
      if: steps.terraform_info.outputs.exists == 'true'
      run: |
        echo ""
        echo "💰 Cost Information"
        echo "=================="
        echo "Instance ID: ${{ steps.terraform_info.outputs.instance_id }}"
        echo "State: ${{ steps.terraform_info.outputs.instance_state }}"
        echo ""
        echo "💡 Estimated costs:"
        echo "- t3.micro running: ~$7.60/month (Free tier eligible)"
        echo "- t3.micro stopped: ~$2/month (EBS storage only)"
        echo "- Elastic IP: Free when attached to running instance"
        echo ""
        echo "🐳 Docker Benefits:"
        echo "- Zero-downtime deployments"
        echo "- Consistent environments"
        echo "- Easy container management"
        echo "- Automatic container restarts on instance reboot"
        echo ""
        echo "💡 Cost optimization tips:"
        echo "- Stop instance when not needed (preserves everything)"
        echo "- Use Elastic IP to keep same IP when stopping/starting"
        echo "- Monitor via AWS Cost Explorer"
