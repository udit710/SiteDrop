name: Destroy SiteDrop Infra

on:
  workflow_dispatch:   # manual trigger only

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup backend and destroy infrastructure
      run: |
        cd infra

        # Check if state bucket exists and create backend config
        if aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-sitedrop')].Name" --output text | grep -q terraform-state-sitedrop; then
          BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-sitedrop')].Name" --output text | head -n1)
          echo "Found state bucket: $BUCKET"

          # Create backend configuration
          cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "$BUCKET"
            key            = "infrastructure/terraform.tfstate"
            region         = "us-east-1"
            dynamodb_table = "terraform-state-lock-sitedrop"
            encrypt        = true
          }
        }
        EOF

          # Initialize with remote state
          terraform init

          # Get site bucket name before destroying (for manual cleanup if needed)
          SITE_BUCKET=$(terraform output -raw s3_bucket 2>/dev/null || echo "")
          if [ ! -z "$SITE_BUCKET" ]; then
            echo "Site bucket to be destroyed: $SITE_BUCKET"
            # Empty the bucket first (though force_destroy should handle this)
            aws s3 rm s3://$SITE_BUCKET --recursive || true
          fi

          # Remove lifecycle protection from state resources
          echo "Removing lifecycle protection from state resources..."

          # Create a temporary override to remove prevent_destroy
          cat > lifecycle_override.tf << 'EOF'
        # Override lifecycle rules to allow destruction
        resource "aws_s3_bucket" "terraform_state" {
          bucket        = "terraform-state-sitedrop-${random_id.bucket_suffix.hex}"
          force_destroy = true

          tags = {
            Name        = "Terraform State Bucket"
            Environment = "infrastructure"
            ManagedBy   = "Terraform"
          }
        }

        resource "aws_dynamodb_table" "terraform_state_lock" {
          name           = "terraform-state-lock-sitedrop"
          billing_mode   = "PAY_PER_REQUEST"
          hash_key       = "LockID"

          attribute {
            name = "LockID"
            type = "S"
          }

          tags = {
            Name        = "Terraform State Lock Table"
            Environment = "infrastructure"
            ManagedBy   = "Terraform"
          }
        }
        EOF

          # Apply the override to remove lifecycle protection
          terraform apply -auto-approve

          # Now destroy all infrastructure
          terraform destroy -auto-approve

          # Clean up state bucket manually (since it has prevent_destroy)
          echo "Cleaning up state bucket: $BUCKET"
          aws s3 rm s3://$BUCKET --recursive || true
          aws s3 rb s3://$BUCKET || true

          # Clean up DynamoDB table
          aws dynamodb delete-table --table-name terraform-state-lock-sitedrop || true

        else
          echo "No state bucket found. Infrastructure may already be destroyed."
        fi
