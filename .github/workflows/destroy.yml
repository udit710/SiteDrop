# Destroy Website Infrastructure using Terraform
name: Destroy Website Infra

on:
  workflow_dispatch:   # manual trigger only

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup backend and destroy infrastructure
      run: |
        cd infra

        # Read variables from tfvars
        PROJECT_NAME=$(grep 'project_name' user.tfvars | cut -d'"' -f2)
        AWS_REGION=$(grep 'aws_region' user.tfvars | cut -d'"' -f2)

        # Check if state bucket exists and create backend config
        if aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-$PROJECT_NAME')].Name" --output text | grep -q terraform-state-$PROJECT_NAME; then
          BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'terraform-state-$PROJECT_NAME')].Name" --output text | head -n1)
          echo "Found state bucket: $BUCKET"

          # Create backend configuration
          cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "$BUCKET"
            key            = "infrastructure/terraform.tfstate"
            region         = "$AWS_REGION"
            dynamodb_table = "terraform-state-lock-$PROJECT_NAME"
            encrypt        = true
          }
        }
        EOF

          # Initialize with remote state
          terraform init -var-file=user.tfvars

          # Get site bucket name before destroying (for manual cleanup if needed)
          SITE_BUCKET=$(terraform output -raw s3_bucket 2>/dev/null || echo "")
          if [ ! -z "$SITE_BUCKET" ]; then
            echo "Site bucket to be destroyed: $SITE_BUCKET"
            # Empty the bucket first (though force_destroy should handle this)
            aws s3 rm s3://$SITE_BUCKET --recursive || true
          fi

          # Destroy all infrastructure
          terraform destroy -var-file=user.tfvars -auto-approve

        else
          echo "No state bucket found. Infrastructure may already be destroyed."
        fi
