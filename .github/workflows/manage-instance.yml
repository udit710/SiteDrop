name: Manage Docker Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - 'status'
          - 'restart-container'
          - 'stop-container'
          - 'start-container'
          - 'container-logs'
          - 'stop-instance'
          - 'start-instance'
          - 'restart-instance'
          - 'terminate'
        default: 'status'

env:
  AWS_REGION: us-east-1
  INSTANCE_NAME: static-site-docker-host

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Find instance
      id: find
      run: |
        INSTANCE_DATA=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
                   "Name=instance-state-name,Values=running,pending,stopping,stopped" \
          --query 'Reservations[0].Instances[0].[InstanceId,State.Name,PublicIpAddress,InstanceType]' \
          --output text 2>/dev/null || echo "None None None None")

        INSTANCE_ID=$(echo $INSTANCE_DATA | cut -f1)
        INSTANCE_STATE=$(echo $INSTANCE_DATA | cut -f2)
        PUBLIC_IP=$(echo $INSTANCE_DATA | cut -f3)
        INSTANCE_TYPE=$(echo $INSTANCE_DATA | cut -f4)

        if [ "$INSTANCE_ID" != "None" ] && [ "$INSTANCE_ID" != "" ]; then
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_state=$INSTANCE_STATE" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "instance_type=$INSTANCE_TYPE" >> $GITHUB_OUTPUT
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup SSH key for container operations
      if: steps.find.outputs.exists == 'true' && steps.find.outputs.instance_state == 'running' && (github.event.inputs.action == 'restart-container' || github.event.inputs.action == 'stop-container' || github.event.inputs.action == 'start-container' || github.event.inputs.action == 'container-logs' || github.event.inputs.action == 'status')
      run: |
        # For container operations, we need SSH access
        # In production, you might want to store the private key as a secret
        echo "⚠️  Note: Container operations require SSH access"
        echo "Consider storing the private key as a GitHub secret for these operations"
        echo "For now, container operations will be limited"

    - name: Show status
      if: steps.find.outputs.exists == 'true'
      run: |
        echo "📊 Instance & Container Status"
        echo "=============================="
        echo "Instance ID: ${{ steps.find.outputs.instance_id }}"
        echo "State: ${{ steps.find.outputs.instance_state }}"
        echo "Type: ${{ steps.find.outputs.instance_type }}"
        echo "Public IP: ${{ steps.find.outputs.public_ip }}"

        if [ "${{ steps.find.outputs.public_ip }}" != "None" ] && [ "${{ steps.find.outputs.instance_state }}" = "running" ]; then
          echo "Site URL: http://${{ steps.find.outputs.public_ip }}"
          echo "Health Check: http://${{ steps.find.outputs.public_ip }}/health"

          # Test if site is accessible
          if curl -f -s "http://${{ steps.find.outputs.public_ip }}" > /dev/null; then
            echo "✅ Site is accessible"
          else
            echo "❌ Site is not accessible"
          fi

          # Test health endpoint
          if curl -f -s "http://${{ steps.find.outputs.public_ip }}/health" > /dev/null; then
            echo "✅ Health endpoint responding"
          else
            echo "❌ Health endpoint not responding"
          fi
        fi

    - name: No instance found
      if: steps.find.outputs.exists == 'false'
      run: |
        echo "❌ No instance found with name: ${{ env.INSTANCE_NAME }}"
        echo "Run the deploy workflow to create a Docker-enabled instance."
        exit 1

    - name: Stop instance
      if: github.event.inputs.action == 'stop-instance' && steps.find.outputs.exists == 'true'
      run: |
        if [ "${{ steps.find.outputs.instance_state }}" = "running" ]; then
          echo "Stopping instance..."
          aws ec2 stop-instances --instance-ids ${{ steps.find.outputs.instance_id }}
          echo "✅ Stop command sent. Instance will stop shortly."
          echo "💡 This will save costs while preserving your data and Docker containers."
          echo "💡 Containers will automatically restart when instance is started again."
        else
          echo "Instance is not running (current state: ${{ steps.find.outputs.instance_state }})"
        fi

    - name: Start instance
      if: github.event.inputs.action == 'start-instance' && steps.find.outputs.exists == 'true'
      run: |
        if [ "${{ steps.find.outputs.instance_state }}" = "stopped" ]; then
          echo "Starting instance..."
          aws ec2 start-instances --instance-ids ${{ steps.find.outputs.instance_id }}
          echo "Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids ${{ steps.find.outputs.instance_id }}

          # Get new public IP
          NEW_PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.find.outputs.instance_id }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)

          echo "✅ Instance started successfully!"
          echo "New public IP: $NEW_PUBLIC_IP"
          echo "Site URL: http://$NEW_PUBLIC_IP"
          echo "💡 Docker containers should automatically restart due to restart policies."
        else
          echo "Instance is not stopped (current state: ${{ steps.find.outputs.instance_state }})"
        fi

    - name: Restart instance
      if: github.event.inputs.action == 'restart-instance' && steps.find.outputs.exists == 'true'
      run: |
        if [ "${{ steps.find.outputs.instance_state }}" = "running" ]; then
          echo "Restarting instance..."
          aws ec2 reboot-instances --instance-ids ${{ steps.find.outputs.instance_id }}
          echo "✅ Restart command sent. Instance will reboot shortly."
          echo "💡 The public IP will remain the same after restart."
          echo "💡 Docker containers will automatically restart."
        else
          echo "Instance is not running (current state: ${{ steps.find.outputs.instance_state }})"
          echo "Use 'start-instance' action instead."
        fi

    - name: Container operations note
      if: (github.event.inputs.action == 'restart-container' || github.event.inputs.action == 'stop-container' || github.event.inputs.action == 'start-container' || github.event.inputs.action == 'container-logs') && steps.find.outputs.exists == 'true' && steps.find.outputs.instance_state == 'running'
      run: |
        echo "🐳 Docker Container Operations"
        echo "============================="
        echo "Instance IP: ${{ steps.find.outputs.public_ip }}"
        echo ""
        echo "To perform container operations, you can SSH to the instance:"
        echo "ssh -i your-key.pem ec2-user@${{ steps.find.outputs.public_ip }}"
        echo ""
        echo "Available container commands:"
        echo "- docker ps                          # Show running containers"
        echo "- docker restart static-site-web     # Restart the web container"
        echo "- docker stop static-site-web        # Stop the web container"
        echo "- docker start static-site-web       # Start the web container"
        echo "- docker logs static-site-web        # View container logs"
        echo "- cd /opt/static-site && ./manage.sh status  # Use management script"
        echo ""
        echo "💡 Container operations require direct SSH access with the deployment key."

    - name: Terminate instance
      if: github.event.inputs.action == 'terminate' && steps.find.outputs.exists == 'true'
      run: |
        echo "⚠️  TERMINATING INSTANCE - THIS CANNOT BE UNDONE!"
        echo "Instance ID: ${{ steps.find.outputs.instance_id }}"
        echo "This will permanently destroy the instance and all data."

        aws ec2 terminate-instances --instance-ids ${{ steps.find.outputs.instance_id }}
        echo "✅ Terminate command sent."
        echo "💡 The instance and all data will be permanently deleted."
        echo "💡 Security groups and key pairs will remain for future use."

    - name: Cost information
      if: steps.find.outputs.exists == 'true'
      run: |
        echo ""
        echo "💰 Cost Information"
        echo "==================="

        case "${{ steps.find.outputs.instance_type }}" in
          "t3.micro")
            echo "Instance type: t3.micro (Free tier eligible)"
            echo "Cost when running: ~$0.0104/hour (~$7.60/month)"
            echo "Cost when stopped: ~$1/month (EBS storage only)"
            ;;
          "t2.micro")
            echo "Instance type: t2.micro (Free tier eligible)"
            echo "Cost when running: ~$0.0116/hour (~$8.50/month)"
            echo "Cost when stopped: ~$1/month (EBS storage only)"
            ;;
          "t2.small")
            echo "Instance type: t2.small"
            echo "Cost when running: ~$0.023/hour (~$17/month)"
            echo "Cost when stopped: ~$1/month (EBS storage only)"
            ;;
          "t3.small")
            echo "Instance type: t3.small"
            echo "Cost when running: ~$0.0208/hour (~$15.20/month)"
            echo "Cost when stopped: ~$1/month (EBS storage only)"
            ;;
          *)
            echo "Instance type: ${{ steps.find.outputs.instance_type }}"
            echo "Check AWS pricing for exact costs"
            ;;
        esac

        echo ""
        echo "🐳 Docker Benefits:"
        echo "- Zero-downtime deployments with rolling updates"
        echo "- Consistent environment across all deployments"
        echo "- Easy rollbacks and container management"
        echo "- Better resource utilization"
        echo "- Automatic container restarts on instance reboot"
        echo ""
        echo "💡 Tips to save money:"
        echo "- Stop the instance when not needed (keeps data & containers)"
        echo "- Use t3.micro for better performance and free tier eligibility"
        echo "- Monitor container resource usage"
        echo "- Terminate if you no longer need the site (destroys everything)"