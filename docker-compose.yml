version: '3.8'

services:
  web:
    build: .
    container_name: static-site-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=static-site"
      - "description=Static site web server"

networks:
  default:
    name: static-site-network
